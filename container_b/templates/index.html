<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpol Live Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .table { color: #e0e0e0; vertical-align: middle; }
        
        .row-new { background-color: rgba(220, 53, 69, 0.35) !important; border-left: 5px solid #dc3545 !important; color: #fff !important; }
        .row-updated { background-color: rgba(255, 193, 7, 0.25) !important; border-left: 5px solid #ffc107 !important; color: #fff !important; }
        .row-baseline { background-color: rgba(25, 135, 84, 0.15) !important; border-left: 5px solid #198754 !important; }
        
        .badge-status { font-size: 0.8rem; padding: 5px 10px; border-radius: 4px; font-weight: 600; }
        .badge-new { background-color: #dc3545; color: #fff; }
        .badge-updated { background-color: #fd7e14; color: #fff; }
        .badge-baseline { background-color: #198754; color: #fff; }
        .badge-normal { background-color: #343a40; color: #adb5bd; }
        
        #searchBox { background-color: #2a2a2a; color: #fff; border: 1px solid #444; }
        #searchBox::placeholder { color: #888; }
    </style>
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🚨 Interpol Live Monitor</h2>
        <div class="text-end">
            <span class="badge bg-primary fs-6 me-2">Total Criminal: <span id="total-count">0</span></span>
            <span class="badge bg-info fs-6" id="scan-status">Status Waiting</span>
        </div>
    </div>
    
    <div class="input-group mb-3">
        <input type="text" id="searchBox" class="form-control" placeholder="Search by Name, ID or Country...">
        <button class="btn btn-outline-secondary" type="button" onclick="currentPage=1; fetchNotices();">Search</button>
    </div>

    <div class="card p-3 shadow-lg">
        <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
            <table class="table table-dark table-hover mb-0">
                <thead style="position: sticky; top: 0; background-color: #1e1e1e; z-index: 1;">
                    <tr class="text-secondary">
                        <th>STATUS</th><th>ENTITY ID</th><th>NAME</th><th>SURNAME</th><th>DOB</th><th>NATIONALITY</th><th>LAST SEEN</th><th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="notices-table"></tbody>
            </table>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-sm btn-outline-light" id="prevBtn" onclick="changePage(-1)">Previous Page</button>
            <span class="text-light" id="pageInfo">Page 1 / ?</span>
            <button class="btn btn-sm btn-outline-light" id="nextBtn" onclick="changePage(1)">Next Page</button>
        </div>
    </div>
</div>
<script>
    let currentPage = 1;
    let searchTimeout = null;

    async function fetchNotices() {
        try {
            const searchTerm = document.getElementById('searchBox').value;
            const response = await fetch(`/api/data?search=${encodeURIComponent(searchTerm)}&page=${currentPage}`);
            const data = await response.json();
            
            document.getElementById('total-count').innerText = data.total;
            document.getElementById('scan-status').innerText = data.scan_status;
            
            const tbody = document.getElementById('notices-table');
            tbody.innerHTML = '';
            
            data.notices.forEach(item => {
                let rowClass = '';
                let badgeHTML = '<span class="badge-status badge-normal">NORMAL</span>';

                if (item.event_type === 'NEW_CRIMINAL') {
                    rowClass = 'row-new';
                    badgeHTML = '<span class="badge-status badge-new">🚨 NEW CRIMINAL ADDED</span>';
                } else if (item.event_type === 'UPDATED') {
                    rowClass = 'row-updated';
                    badgeHTML = '<span class="badge-status badge-updated">⚠️ UPDATED</span>';
                } else if (item.event_type === 'BASELINE_ADDED') {
                    rowClass = 'row-baseline';
                    badgeHTML = '<span class="badge-status badge-baseline">✅ ADDED</span>';
                }

                tbody.innerHTML += `
                    <tr class="${rowClass}" onclick="window.open('/notice/${item.entity_id}', '_blank')" style="cursor: pointer;">
                        <td>${badgeHTML}</td>
                        <td><strong>${item.entity_id}</strong></td>
                        <td>${item.forename || '-'}</td>
                        <td>${item.name || '-'}</td>
                        <td>${item.date_of_birth || '-'}</td>
                        <td>${item.nationalities || '-'}</td>
                        <td><small class="text-secondary">${item.updated_at || '-'}</small></td>
                        <td><button class="btn btn-sm btn-info text-white" onclick="event.stopPropagation(); window.open('/notice/${item.entity_id}', '_blank')">Details</button></td>
                    </tr>`;
            });

            const totalPages = Math.ceil(data.total / data.per_page) || 1;
            document.getElementById('pageInfo').innerText = `Page ${currentPage} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        } catch (err) { 
            console.error("Fetch Error:", err); 
        }
    }

    function changePage(direction) {
        currentPage += direction;
        if (currentPage < 1) currentPage = 1;
        fetchNotices();
    }

    document.getElementById('searchBox').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentPage = 1;
            fetchNotices();
        }, 400); 
    });
    
    fetchNotices();
    setInterval(fetchNotices, 5000);
</script>
</body>
</html>
